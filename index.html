<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100b1c"><title>BeatFlix</title><style>*{box-sizing:border-box}body{margin:0;background:#100b1c;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}header{padding:26px 20px 12px;background:linear-gradient(145deg,#39205b,#100b1c)}h1{font-size:32px;margin:0;color:#cba5ff}p{color:#bcb3ca}main{padding:18px 20px 160px}input{width:100%;padding:15px;border-radius:14px;border:1px solid #56436d;background:#241934;color:white;font-size:16px}.track{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #352741}.art{width:58px;height:58px;flex-shrink:0;border-radius:12px;background:linear-gradient(135deg,#8c39ff,#f54a9b);display:grid;place-items:center;font-size:28px}.info{flex:1;min-width:0}.info strong{display:block}.info small{color:#b9abc9}.track button, .controls button{border:0;background:#a85cff;color:white;border-radius:30px;padding:11px 15px;font-weight:700}footer{position:fixed;bottom:0;left:0;right:0;background:#251632;padding:14px 20px 25px;box-shadow:0 -6px 30px #0007}#now{font-size:14px;margin-bottom:10px}audio{width:100%;height:45px}label{display:block;margin:18px 0 8px;font-weight:700}.upload{display:block;background:#2b2040;border:1px dashed #8e65ba;border-radius:15px;padding:18px;text-align:center}#file{display:none}.hint{font-size:13px}h2{font-size:20px}</style></head><body><header><h1>♫ BeatFlix</h1><p>Your music. Your vibe. 🎧</p><input id="search" placeholder="Search your songs..." aria-label="Search songs"></header><main><h2>My music library</h2><label class="upload" for="file">＋ Add music from your iPhone Files</label><input id="file" type="file" accept="audio/*" multiple><p class="hint">Choose audio files you own or have permission to play. Files stay on your device; re-add them when you reopen the page.</p><div id="list"><p>No songs yet. Tap “Add music” to begin.</p></div></main><footer><div id="now">🎵 Choose a song to play</div><audio id="player" controls playsinline></audio></footer><script>const file=document.getElementById('file'),list=document.getElementById('list'),search=document.getElementById('search'),player=document.getElementById('player'),now=document.getElementById('now');let songs=[];function render(){const q=search.value.toLowerCase();list.replaceChildren();let filtered=songs.filter(s=>s.name.toLowerCase().includes(q));if(!filtered.length){let p=document.createElement('p');p.textContent=songs.length?'No matching songs.':'No songs yet. Tap “Add music” to begin.';list.append(p)}filtered.forEach(s=>{let row=document.createElement('div');row.className='track';let art=document.createElement('div');art.className='art';art.textContent='♫';let info=document.createElement('div');info.className='info';let title=document.createElement('strong');title.textContent=s.name;let sub=document.createElement('small');sub.textContent='Your library';info.append(title,sub);let btn=document.createElement('button');btn.textContent='▶';btn.setAttribute('aria-label','Play '+s.name);btn.onclick=()=>{player.src=s.url;now.textContent='Now playing: '+s.name;player.play().catch(()=>{})};row.append(art,info,btn);list.append(row)})}file.onchange=()=>{for(const f of file.files){if(f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name))songs.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)})}render();file.value=''};search.oninput=render;render();</script></body></html>
